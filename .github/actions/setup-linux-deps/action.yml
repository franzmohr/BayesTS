name: Set up BayesTS build dependencies (Linux)
description: >
  Installs the toolchain and libraries a BayesTS build needs on an Ubuntu
  runner. Four workflows need the same set, so it lives here rather than being
  copied into each of them.

inputs:
  highfive-ref:
    description: >
      Git ref of HighFive to use. Defaults to the contents of
      .github/highfive-version, which is the single place this is pinned --
      ci.yml and release.yml read the same file for their Windows jobs, so a bump
      is one edit rather than three.
    required: false
    default: ''
  doxygen:
    description: Also install Doxygen and Graphviz, for the docs target.
    required: false
    default: 'false'

outputs:
  prefix-path:
    description: Value to pass as -DCMAKE_PREFIX_PATH.
    value: ${{ steps.vcpkg.outputs.prefix }}
  highfive-dir:
    description: Value to pass as -DHIGHFIVE_DIR.
    value: ${{ steps.highfive.outputs.dir }}

runs:
  using: composite
  steps:
    # Fortran is not optional: the top-level project() declares C, CXX and
    # Fortran, because the BLAS and LAPACK the samplers lean on are Fortran.
    - name: Install toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gfortran
        if [ "${{ inputs.doxygen }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends doxygen graphviz
        fi

    # cmake_minimum_required is well ahead of what Ubuntu ships, so the runner's
    # apt CMake will not configure this project. This action also brings Ninja,
    # which the presets use.
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Fail early if CMake is too old
      shell: bash
      run: |
        # Reading the floor out of CMakeLists rather than repeating it here, so
        # this check cannot drift away from what the project actually requires.
        required=$(sed -n 's/^cmake_minimum_required(VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
        have=$(cmake --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "CMake required >= $required, have $have"
        # sort -V puts the smaller version first; if that is not the requirement
        # then what we have is older than the floor.
        if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
          echo "::error::CMake $have is older than the required $required."
          exit 1
        fi

    # Armadillo and HDF5 come from vcpkg, not apt, and the reason is specific:
    # the project finds both in CONFIG mode, and Debian's libarmadillo-dev ships
    # no ArmadilloConfig.cmake at all. CMake's bundled FindArmadillo would find
    # the library but defines only variables, no imported target, so it cannot
    # satisfy `target_link_libraries(bayests_core PUBLIC armadillo)`; and its
    # FindHDF5 defines HDF5::HDF5, not the hdf5::hdf5-shared this project links.
    # Only the upstream CMake configs provide those names, and vcpkg installs
    # them. It is also what the author builds against locally, so CI and a
    # desktop build resolve their dependencies the same way.
    #
    # The triplet has to be dynamic. x64-linux is static-only, and a static HDF5
    # provides hdf5::hdf5-static rather than the -shared target linked here.
    # Only the built packages are cached, never the vcpkg checkout: restoring a
    # tree into the clone target would make `git clone` refuse a non-empty
    # directory, so the two live side by side and the clone is always fresh.
    - name: Cache vcpkg packages
      id: vcpkg-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-installed
        # Bumping the trailing -vN is the way to discard a tree that has gone
        # bad; nothing about time or upstream vcpkg is in the key, so a hit is a
        # hit until the requested package set changes.
        key: vcpkg-x64-linux-dynamic-armadillo-hdf5-${{ runner.os }}-v1

    - name: Install Armadillo and HDF5
      id: vcpkg
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/vcpkg"
        inst="$RUNNER_TEMP/vcpkg-installed"
        triplet=x64-linux-dynamic
        prefix="$inst/$triplet"

        # A cache hit is the whole point: the installed tree is all CMake reads,
        # so on a hit neither vcpkg nor a compiler has to run at all.
        if [ -d "$prefix" ]; then
          echo "vcpkg tree restored from cache"
        else
          sudo apt-get install -y --no-install-recommends \
            curl zip unzip tar pkg-config
          git clone --depth 1 https://github.com/microsoft/vcpkg "$root"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          # --x-install-root keeps the built packages outside the checkout, which
          # is what lets the cache above cover them on their own. It carries
          # vcpkg's experimental x- prefix; if a future vcpkg drops it, the fix is
          # to cache "$root/installed" instead and delete $inst from this step --
          # the clone is skipped on a cache hit either way, so nothing else moves.
          "$root/vcpkg" install --triplet "$triplet" \
            --x-install-root="$inst" armadillo hdf5
        fi

        # Fail here rather than at find_package, whose message names a missing
        # .cmake file and says nothing about vcpkg. Matched case-insensitively on
        # both spellings CMake accepts -- ArmadilloConfig.cmake and
        # armadillo-config.cmake -- so a port that renames its config does not
        # block a build that would in fact have worked.
        for pkg in armadillo hdf5; do
          found=$(find "$prefix/share" -maxdepth 2 -iname '*config.cmake' \
                    -ipath "*$pkg*" 2>/dev/null | head -3)
          if [ -z "$found" ]; then
            echo "::error::no CMake config for $pkg under $prefix; the vcpkg install did not produce a usable one."
            find "$prefix/share" -maxdepth 2 -iname '*config.cmake' | head -30
            exit 1
          fi
          echo "$pkg: $found"
        done
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

    # Header-only, and the project locates it by looking for
    # include/highfive/H5File.hpp under the given prefix -- which is exactly the
    # layout of the source tree, so no build or install step is needed. Not taken
    # from vcpkg: its port tracks the 2.x line, and this project is developed
    # against 3.x.
    #
    # The URL is the old BlueBrain path on purpose. Upstream has moved to
    # github.com/highfive-devs/highfive and BlueBrain/HighFive now redirects;
    # the redirect is what is known to work here, so it stays until the new path
    # has been confirmed to serve refs.
    #
    # Beware the version numbering: HighFive 3.0.0 has no release tag, only
    # v3.0.0-beta1 and v3.0.0-beta2, while the beta's H5Version.hpp already
    # reports 3.0.0. Reading the header is therefore not a way to find the tag --
    # which is how `v3.0.0` came to be pinned here and broke the build.
    - name: Fetch HighFive
      id: highfive
      shell: bash
      run: |
        url=https://github.com/BlueBrain/HighFive.git
        dir="$RUNNER_TEMP/highfive"

        ref="${{ inputs.highfive-ref }}"
        if [ -z "$ref" ]; then
          ref=$(tr -d '[:space:]' < .github/highfive-version)
        fi
        echo "HighFive ref: $ref"

        # Checked before cloning so a bad pin says what the valid ones are.
        # `git clone --branch` on its own only reports that the ref is missing,
        # which leaves the next person guessing at the naming convention.
        if ! git ls-remote --exit-code "$url" "refs/tags/$ref" >/dev/null 2>&1; then
          echo "::error::HighFive has no tag '$ref' (pinned in .github/highfive-version)."
          echo "Tags on the 3.x line:"
          git ls-remote --tags "$url" 'refs/tags/v3*' | sed 's|.*refs/tags/|  |'
          exit 1
        fi

        git clone --depth 1 --branch "$ref" "$url" "$dir"
        test -f "$dir/include/highfive/H5File.hpp" \
          || { echo "::error::HighFive layout unexpected in $dir"; exit 1; }
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

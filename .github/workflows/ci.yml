# Build and run the test suite.
#
# What this proves and what it does not: `ctest` here is a smoke test. Every
# sampler and code path runs and a fixture that throws fails the job, which
# catches a build break, an uninitialised read that trips a validate(), and a
# dimension mismatch. It does *not* catch a change in the numbers, which is what
# most regressions in this codebase look like -- the fingerprints are only
# comparable within one toolchain, so a stored expectation would fail on every
# machine but the one that recorded it. The fingerprints workflow does that
# comparison instead, base against head inside a single job.
#
# Coverage note: VarNormalWishart's fixtures need BAYESTS_WISHART_FIXTURE
# pointing at a recorded model file, and those are hundreds of megabytes and not
# in the repository, so the w-* tests do not run here. See test/CMakeLists.txt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a second push to a PR makes the earlier run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ubuntu / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    env:
      # The golden harness refuses to run unless both are pinned: a
      # multi-threaded BLAS reassociates floating-point reductions, and a
      # fingerprint that cannot be reproduced is worse than none. test/
      # CMakeLists.txt already sets these per test; this covers the fixture
      # generators too, and makes the requirement visible here.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies
        id: deps
        uses: ./.github/actions/setup-linux-deps

      # Configured without a preset. The presets do not carry a
      # CMAKE_PREFIX_PATH -- that lives in the gitignored, machine-specific
      # CMakeUserPresets.json -- so CI has to pass its own paths regardless, and
      # spelling the configure out keeps this readable and independent of preset
      # churn. BAYESTS_NATIVE_ARCH stays off: the binary is built and run on the
      # same runner, so it buys nothing and only risks an illegal instruction if
      # a job is ever split across machines.
      # CMAKE_MAP_IMPORTED_CONFIG_DEBUG is what keeps the Debug job honest. vcpkg
      # installs a debug variant of every port alongside the release one, and a
      # Debug build of this project would otherwise link those -- so the job would
      # be testing BayesTS against a debug Armadillo and HDF5 that no user has.
      # Mapping Debug onto the release location means only BayesTS is built
      # unoptimised, which is the point of the job; the dependencies stay the ones
      # the Release job and every consumer use. The trailing empty element lets a
      # target with no per-configuration location still resolve.
      - name: Configure
        run: |
          cmake -S . -B build/bin/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_MAP_IMPORTED_CONFIG_DEBUG="Release;RelWithDebInfo;" \
            -DCMAKE_PREFIX_PATH="${{ steps.deps.outputs.prefix-path }}" \
            -DHIGHFIVE_DIR="${{ steps.deps.outputs.highfive-dir }}" \
            -DBAYESTS_BUILD_DOCS=OFF \
            -DBAYESTS_BUILD_TESTS=ON \
            -DBAYESTS_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build/bin/ci --parallel

      - name: Test
        run: ctest --test-dir build/bin/ci --output-on-failure

      # ctest reports a failed golden test as "Failed" whether the binary threw or
      # never started, and those want different fixes. This separates them: if the
      # no-argument run prints its usage line the binary loads fine and the problem
      # is in what it does, and if it does not, ldd says which library is missing.
      # Running one fixture by hand then shows the actual message.
      - name: Diagnose a test failure
        if: failure()
        run: |
          exe=build/bin/ci/test/bayests_golden
          echo "::group::binary and its shared libraries"
          ls -l "$exe" || echo "the binary was never built"
          ldd "$exe" 2>&1 | grep -iE "not found|armadillo|hdf5" || ldd "$exe" 2>&1 | head -20
          echo "::endgroup::"

          echo "::group::does it start? (expect the usage line and exit 2)"
          "$exe" || echo "exit=$?"
          echo "::endgroup::"

          echo "::group::one fixture, threads pinned"
          fixture=$(find build/bin/ci/test/fixtures -name '*.h5' | head -1)
          echo "using $fixture"
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 "$exe" "$fixture" || echo "exit=$?"
          echo "::endgroup::"

      # The install and package steps are part of the contract too -- a missing
      # file in the install() list or a CPack generator whose tool is absent only
      # shows up here. Release only, to keep the Debug job to build-and-test.
      - name: Install
        if: matrix.build_type == 'Release'
        run: cmake --install build/bin/ci --prefix "$RUNNER_TEMP/staged"

      - name: Package
        if: matrix.build_type == 'Release'
        run: cmake --build build/bin/ci --target package

  # The project's primary development platform, and the reason the Fortran
  # requirement is awkward: MSVC has no Fortran compiler, so this uses the same
  # MSYS2 UCRT64 toolchain as a local build rather than the runner's Visual
  # Studio. Armadillo and HDF5 come from pacman; HighFive is header-only.
  windows:
    name: windows / msys2 ucrt64 / Release
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          # gcc-fortran is named explicitly even though the toolchain group is
          # supposed to contain it. project() declares Fortran, and relying on
          # group membership is how a job ends up with gcc and g++ but no
          # gfortran -- which fails at configure with "No CMAKE_Fortran_COMPILER
          # could be found", a message that names no package.
          pacboy: >-
            toolchain:p
            gcc-fortran:p
            cmake:p
            ninja:p
            armadillo:p
            hdf5:p
            openblas:p

      # Checked before configure so a missing compiler is reported here, against
      # the step that was supposed to install it, rather than 100 lines later.
      - name: Verify the toolchain
        run: |
          for tool in gcc g++ gfortran cmake ninja; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
            printf '%-9s %s\n' "$tool" "$($tool --version | head -1)"
          done

      # Pinned in .github/highfive-version, the same file the Linux jobs read
      # through the composite action. See that action for why the tag is a beta
      # and why the URL is the old BlueBrain path.
      - name: Fetch HighFive
        run: |
          ref=$(tr -d '[:space:]' < .github/highfive-version)
          echo "HighFive ref: $ref"
          git clone --depth 1 --branch "$ref" \
            https://github.com/BlueBrain/HighFive.git "$RUNNER_TEMP/highfive"
          test -f "$RUNNER_TEMP/highfive/include/highfive/H5File.hpp"

      - name: Configure
        run: |
          cmake -S . -B build/bin/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIGHFIVE_DIR="$RUNNER_TEMP/highfive" \
            -DBAYESTS_BUILD_DOCS=OFF \
            -DBAYESTS_BUILD_TESTS=ON \
            -DBAYESTS_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build/bin/ci --parallel

      - name: Test
        run: ctest --test-dir build/bin/ci --output-on-failure

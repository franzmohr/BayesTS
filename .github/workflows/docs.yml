# Build the Doxygen documentation, and publish it from main.
#
# The `docs` target is deliberately not part of ALL, so a normal build never
# needs Doxygen and nothing else in CI exercises this. That makes it easy for a
# malformed comment block or a stale path in Doxyfile.in to sit unnoticed, which
# is what this job is for.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - '*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up dependencies
        id: deps
        uses: ./.github/actions/setup-linux-deps
        with:
          doxygen: 'true'

      # Tests off: this configure exists to produce a Doxyfile and nothing here
      # compiles the samplers.
      - name: Configure
        run: |
          cmake -S . -B build/bin/docs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ steps.deps.outputs.prefix-path }}" \
            -DHIGHFIVE_DIR="${{ steps.deps.outputs.highfive-dir }}" \
            -DBAYESTS_BUILD_DOCS=ON \
            -DBAYESTS_BUILD_TESTS=OFF

      # Doxygen warnings are the point of running this, so they are surfaced as
      # annotations rather than buried in the log. Not fatal: Doxygen warns about
      # undocumented entities, and this project documents deliberately rather
      # than exhaustively.
      - name: Build docs
        run: |
          cmake --build build/bin/docs --target docs 2>&1 | tee doxygen.log
          test -f build/bin/docs/docs/html/index.html \
            || { echo "::error::Doxygen produced no index.html"; exit 1; }
          if grep -E 'warning:' doxygen.log > warnings.txt; then
            echo "::group::Doxygen warnings ($(wc -l < warnings.txt))"
            cat warnings.txt
            echo "::endgroup::"
            {
              echo "### Doxygen warnings: $(wc -l < warnings.txt)"
              echo '```'
              head -50 warnings.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: doxygen-html
          path: build/bin/docs/docs/html

      # Pages needs no artifact of its own on a PR, and uploading one from a fork
      # would be pointless -- only main is published.
      #
      # This and deploy-pages below are the two actions still on Node 20, and so
      # still emit the deprecation warning. Left where they are on purpose: their
      # major versions do not track the other actions/* repositories, and pinning
      # a tag that does not exist turns a warning into "Unable to resolve action".
      # Dependabot proposes the correct bump, and the deploy job is inert until
      # Pages is enabled anyway.
      - name: Package for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/bin/docs/docs/html

  # Requires Settings -> Pages -> Source set to "GitHub Actions" on the repository.
  # Until that is switched on, this job cannot succeed -- but it does not fail
  # either, which is the trap: deploy-pages creates a deployment and then waits for
  # it to go live, and with Pages disabled nothing ever processes it, so the action
  # polls until the job's timeout. The default timeout is six hours. Hence both the
  # preflight check and the timeout below. The build job above is unaffected either
  # way, and its doxygen-html artifact holds the site.
  deploy:
    name: publish to pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # A deployment that is genuinely in flight must not be cancelled by the next
    # push, so this group deliberately does not cancel in progress -- unlike the
    # workflow-level group, which exists to drop superseded PR doc builds.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Generous enough for a real deployment, short enough that a misconfiguration
    # is reported the same morning.
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Two distinct misconfigurations both end in the same silent wait: Pages not
      # enabled at all, and Pages enabled with a *branch* source, which ignores
      # deployments made from a workflow. `build_type` tells them apart -- it reads
      # "workflow" only when the source is GitHub Actions.
      - name: Check that Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh's own --jq does the extraction, so this needs no jq on the runner.
          # A missing jq would otherwise report an empty build_type and blame the
          # source setting for what is really an absent tool.
          if ! build_type=$(gh api "repos/${{ github.repository }}/pages" \
                              --jq '.build_type // "unknown"' 2>&1); then
            echo "::error::GitHub Pages is not enabled for ${{ github.repository }}. Enable it under Settings -> Pages and set Source to \"GitHub Actions\", then re-run. Until then the site is available as the doxygen-html artifact of the build job."
            echo "$build_type"
            exit 1
          fi

          echo "Pages source: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages is enabled but its source is '$build_type', not GitHub Actions, so a deployment made by this workflow would never be published. Change it under Settings -> Pages."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4

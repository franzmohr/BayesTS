# Build the snap and check that the result starts.
#
# This is the only job that builds against a distribution's own packages rather
# than vcpkg, which makes it the only one that exercises the MODULE-mode
# fallbacks for Armadillo and HDF5 in CMakeLists.txt. ci.yml cannot: it installs
# both from vcpkg, so CONFIG mode always wins there.
#
# The other thing it catches is the part of snapcraft.yaml that no local check
# can: the stage-package sonames are those of the core24 base, and a base bump
# or an archive rename turns one of them into a pull-time "package not found".
#
# It does not upload anything. Publishing needs a store credential this
# repository does not hold; `snapcraft upload` is a manual step, documented in
# the Packaging section of README.md.

name: Snap

on:
  push:
    branches: [main]
    paths:
      - 'snap/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - '.github/highfive-version'
      - '.github/workflows/snap.yml'
  pull_request:
    paths:
      - 'snap/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - '.github/highfive-version'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: snap / core24 / amd64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The HighFive tag is written twice -- in .github/highfive-version, which
      # ci.yml and release.yml read, and as source-tag in snapcraft.yaml, which
      # has no copy of this repository to read it from. Nothing in a snap build
      # would notice them disagreeing: it would just compile against a different
      # HighFive than every other job. So the comparison happens here, where both
      # files are present.
      - name: Check the HighFive pin agrees with .github/highfive-version
        run: |
          pinned=$(tr -d '[:space:]' < .github/highfive-version)
          insnap=$(sed -n 's/^ *source-tag: *\(.*\)$/\1/p' snap/snapcraft.yaml | tr -d '[:space:]')
          echo ".github/highfive-version: $pinned"
          echo "snap/snapcraft.yaml:      $insnap"
          if [ "$pinned" != "$insnap" ]; then
            echo "::error::the HighFive pin differs between the two files; bump both."
            exit 1
          fi

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1

      # A snap that builds and does not run is the failure mode worth guarding
      # against here: a missing stage-package produces a working build and a
      # binary that cannot find its libraries. With no arguments bayests prints
      # its usage and exits 2, so that exit code is the evidence it loaded.
      - name: Install and run it
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          set +e
          out=$(bayests 2>&1)
          status=$?
          set -e
          echo "$out"
          echo "exit=$status"
          if [ "$status" -ne 2 ]; then
            echo "::error::expected the usage message and exit 2, got exit $status."

            # The libraries have to be resolved the way the snap resolves them,
            # which is not the way the host does. /snap/bin/bayests is a wrapper
            # script, so ldd needs the real ELF inside the mount -- but running
            # ldd on it from the host reports libarmadillo, libhdf5 and the rest
            # as "not found" even when the snap runs perfectly, because the host
            # has none of the $SNAP library paths the snap's own environment
            # sets up. That listing named every dependency and identified none,
            # which is worse than no listing at all.
            #
            # `snap run --shell` gives a shell inside that environment, so a
            # "not found" there is a real missing library -- and a real one is
            # almost always a soname that apt unpacked into a subdirectory
            # (Ubuntu's BLAS packages do, see snap/snapcraft.yaml) or a
            # stage-package that was never named.
            #
            # The redirect from /dev/null is what keeps this from becoming its
            # own problem: if a future snapd stops forwarding `-c` to that
            # shell, bash starts interactively instead, and reading EOF makes it
            # exit quietly rather than wait for input on a runner that has no
            # terminal. The step then reports nothing found, which is the same
            # as it managing to report nothing found -- so a broken probe costs
            # a diagnostic, never the job.
            echo "Libraries the snap cannot resolve in its own environment:"
            snap run --shell bayests -c 'ldd "$SNAP/usr/bin/bayests"' </dev/null 2>&1 \
              | grep -i "not found" \
              || echo "(nothing reported missing -- look elsewhere for the cause)"
            exit 1
          fi

      - name: Upload the snap
        uses: actions/upload-artifact@v7
        with:
          name: bayests-snap-amd64
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
